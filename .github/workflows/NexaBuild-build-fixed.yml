name: NexaBuild Build APK
run-name: NexaBuild Build - ${{ inputs.upload_id }}

on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: 'Unique NexaBuilder upload ID'
        required: true
        type: string
      upload_ref:
        description: 'Temporary branch containing upload chunks'
        required: true
        type: string
      app_name:
        description: 'Android app name'
        required: true
        type: string
      package_id:
        description: 'Android application ID'
        required: true
        type: string
      app_version:
        description: 'Android version name'
        required: true
        type: string
      version_code:
        description: 'Android version code'
        required: true
        type: string
      internet_mode:
        description: 'Allow Internet access'
        required: false
        default: 'online'
        type: choice
        options:
          - online
          - offline
      camera_permission:
        description: 'Add camera permission'
        required: false
        default: false
        type: boolean
      wake_lock:
        description: 'Keep screen awake'
        required: false
        default: false
        type: boolean
      vibrate_permission:
        description: 'Add vibration permission'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: nexabuilder-${{ inputs.upload_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate website and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          rules = {
              "UPLOAD_ID": r"^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
              "UPLOAD_REF": r"^nexabuilder-upload-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
              "PACKAGE_ID": r"^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$",
              "APP_VERSION": r"^\d+(\.\d+){0,3}$",
              "VERSION_CODE": r"^[1-9]\d{0,9}$",
          }
          for key, pattern in rules.items():
              val = os.environ.get(key, "")
              if not re.fullmatch(pattern, val, re.I if "UPLOAD" in key else 0):
                  print(f"Invalid input: {key}", file=sys.stderr)
                  sys.exit(2)
          print("Inputs validated successfully.")
          PY
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
          PACKAGE_ID: ${{ inputs.package_id }}
          APP_VERSION: ${{ inputs.app_version }}
          VERSION_CODE: ${{ inputs.version_code }}

      - name: Fetch uploaded ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_ID: ${{ inputs.upload_id }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags origin "refs/heads/${UPLOAD_REF}:refs/remotes/origin/${UPLOAD_REF}"
          unset auth GH_TOKEN
          git archive "refs/remotes/origin/${UPLOAD_REF}" ".nexabuilder/incoming/${UPLOAD_ID}" | tar -x
          upload_dir=".nexabuilder/incoming/${UPLOAD_ID}"
          shopt -s nullglob
          chunks=("${upload_dir}"/parts/part-*.bin)
          if [[ ${#chunks[@]} -lt 1 ]]; then
            echo "No upload chunks found." >&2
            exit 2
          fi
          cat "${chunks[@]}" > "$RUNNER_TEMP/nexabuilder-project.zip"
          if [[ -f "${upload_dir}/icon.bin" ]]; then
            cp "${upload_dir}/icon.bin" "$RUNNER_TEMP/nexabuilder-icon.bin"
          fi

      - name: Setup environment (Java, Node, Python)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | tail -n 1)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare Site & Capacitor App
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          APP_VERSION: ${{ inputs.app_version }}
          VERSION_CODE: ${{ inputs.version_code }}
          INTERNET_MODE: ${{ inputs.internet_mode }}
          CAMERA_PERMISSION: ${{ inputs.camera_permission }}
          WAKE_LOCK: ${{ inputs.wake_lock }}
          VIBRATE_PERMISSION: ${{ inputs.vibrate_permission }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Pillow==12.0.0/Pillow>=10.0.0/' scripts/requirements.txt || true
          python3 -m pip install --no-cache-dir -r scripts/requirements.txt
          python3 scripts/prepare_site.py --zip "$RUNNER_TEMP/nexabuilder-project.zip" --out "$RUNNER_TEMP/nexabuilder-www"
          if [[ "${INTERNET_MODE}" == "offline" ]]; then
            python3 scripts/enable_offline.py "$RUNNER_TEMP/nexabuilder-www"
          fi
          
          APP_DIR="$RUNNER_TEMP/nexabuilder-app"
          mkdir -p "$APP_DIR"
          cp -a "$RUNNER_TEMP/nexabuilder-www" "$APP_DIR/www"
          cd "$APP_DIR"
          npm init -y >/dev/null
          npm install --save-exact @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest
          
          node --input-type=module << 'NODE'
          import fs from 'node:fs';
          const config = {
            appId: process.env.PACKAGE_ID,
            appName: process.env.APP_NAME,
            webDir: 'www'
          };
          fs.writeFileSync('capacitor.config.ts', `import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = ${JSON.stringify(config, null, 2)};
          export default config;
          `, 'utf8');
          NODE
          
          npx cap add android
          npx cap sync android
          
          ICON_ARGS=()
          [[ -f "$RUNNER_TEMP/nexabuilder-icon.bin" ]] && ICON_ARGS=(--source "$RUNNER_TEMP/nexabuilder-icon.bin")
          
          CONFIG_ARGS=(
            --android-dir "$APP_DIR/android"
            --app-name "$APP_NAME"
            --package-id "$PACKAGE_ID"
            --version "$APP_VERSION"
            --version-code "$VERSION_CODE"
            --internet-mode "$INTERNET_MODE"
          )
          [[ "${CAMERA_PERMISSION}" == "true" ]] && CONFIG_ARGS+=(--camera)
          [[ "${WAKE_LOCK}" == "true" ]] && CONFIG_ARGS+=(--wake-lock)
          [[ "${VIBRATE_PERMISSION}" == "true" ]] && CONFIG_ARGS+=(--vibrate)
          
          python3 "$GITHUB_WORKSPACE/scripts/configure_android.py" "${CONFIG_ARGS[@]}"
          python3 "$GITHUB_WORKSPACE/scripts/generate_android_icons.py" --android-dir "$APP_DIR/android" "${ICON_ARGS[@]}"
          echo "NEXABUILDER_APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build APK (Absolute Tolerant Mode)
        shell: bash
        run: |
          set +e
          cd "$NEXABUILDER_APP_DIR/android"
          
          ./gradlew --no-daemon assembleDebug --continue || true
          
          apk="$(find . -name "app-debug.apk" | head -n 1)"
          
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "Mencoba menyusun ulang dengan gradle clean..."
            ./gradlew --no-daemon clean assembleDebug --continue || true
            apk="$(find . -name "app-debug.apk" | head -n 1)"
          fi
          
          if [[ -n "$apk" && -f "$apk" ]]; then
            echo "APK BERHASIL DITEMUKAN DI: $apk"
            mkdir -p "$RUNNER_TEMP/nexabuilder-output"
            cp "$apk" "$RUNNER_TEMP/nexabuilder-output/NexaBuild.apk"
            sha256sum "$RUNNER_TEMP/nexabuilder-output/NexaBuild.apk" > "$RUNNER_TEMP/nexabuilder-output/SHA256SUMS.txt"
            echo "APK siap diunggah ke artifact."
            exit 0
          else
            echo "FATAL: APK tidak dapat ditemukan." >&2
            exit 1
          fi

      - name: Upload APK Artifact & Release
        uses: actions/upload-artifact@v4
        with:
          name: nexabuild-${{ inputs.upload_id }}
          path: ${{ runner.temp }}/nexabuilder-output/
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="nexabuild-${{ inputs.upload_id }}"
          gh release create "$tag" "${{ runner.temp }}/nexabuilder-output/NexaBuild.apk#NexaBuild.apk" --title "Build ${{ inputs.app_name }}" --notes "Automated build" --target "$GITHUB_SHA" || true

      - name: Cleanup temporary branch
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sX DELETE -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/${{ inputs.upload_ref }}" || true
